<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Digital Sathi</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <h1>Contact Digital Sathi</h1>
    <p>Share your suggestions and feedback</p>
    <nav>
        <a href="homepage.html">Home</a>
        <a href="about.html">About</a>
        <a href="learn.html">Learn</a>
        <a href="safety.html">Online Safety</a>
        <a href="payments.html">Digital Payments</a>
        <a href="fake-news.html">Fake News</a>
        <a href="quiz.html">Quiz</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="card">
        <h2>We Value Your Feedback</h2>
        <p>Tell us what you think about our Digital Literacy & Awareness website.</p>

        <form id="contactForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required maxlength="80">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required maxlength="150">

            <label for="topic">Feedback Topic</label>
            <select id="topic" name="topic" required>
                <option value="">Select a topic</option>
                <option value="website">Website improvement</option>
                <option value="learning">Learning resources</option>
                <option value="safety">Online safety</option>
                <option value="payments">Digital payments</option>
                <option value="other">Other suggestion</option>
            </select>

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5"
                required maxlength="1000"></textarea>

            <button type="submit" class="button">Submit Feedback</button>
        </form>

        <div id="contactResult" class="result" aria-live="polite" hidden></div>
    </section>
</main>

<footer><p>© 2026 Digital Sathi</p></footer>
</body>
</html>
